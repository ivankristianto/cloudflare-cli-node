name: Publish to NPM

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: npm install and build
        run: |
          npm ci
          npm test
          npm run lint

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # npm trusted publishing: OIDC replaces NPM_TOKEN. npm needs this workflow's
    # filename (npm-publish.yml) registered as the package's trusted publisher.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm publish
